name: Release

# 推送 v* 标签 → 三平台构建 → GitHub Release(草稿)
# 产物:macOS DMG(aarch64)、Linux AppImage/deb、Windows NSIS exe
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # aarch64 (Apple Silicon)
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps (Tauri)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 说明:初期发未签名包。启用签名/公证时补充以下 secrets:
      #  - macOS:APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #  - updater 签名(若引入 tauri-plugin-updater):TAURI_SIGNING_PRIVATE_KEY(+PASSWORD)
      - name: Build & Upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "SessionSeek v__VERSION__"
          releaseBody: "本地 AI 会话查看器(Claude / Codex / ZCode / DeepSeek Harness)。macOS 包未签名,首次打开请右键→打开。"
          releaseDraft: true
          prerelease: false
