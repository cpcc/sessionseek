[package]
name = "sessionseek"
version = "0.1.0"
description = "统一查看 Claude / Codex / ZCode / DeepSeek Harness 本地 AI 会话"
edition = "2021"

[lib]
name = "sessionseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
log = "0.4"
notify = "9.0.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
